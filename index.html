<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nandi Sihol</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Earthy organic gradient palette */
      background: linear-gradient(135deg, #c86d51 0%, #d4a373 35%, #a3b18a 70%, #e9edc9 100%);
      color: #283618;
      overflow-x: hidden;
      padding: 90px 20px 40px 20px;
      position: relative;
    }

    /* Top Brand Header */
    .top-header {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #283618;
      z-index: 10;
    }

    /* Main Center Container */
    .hero-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 2;
    }

    /* Center Square Media Frame (Enlarged Dimension) */
    .center-media-wrapper {
      width: clamp(280px, 40vw, 440px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      border: 3px solid #283618;
      box-shadow: 7px 7px 0px #283618;
      overflow: hidden;
      background: #fefae0;
      transition: transform 0.3s ease;
      position: relative;
    }

    .center-media-wrapper:hover {
      transform: scale(1.02);
    }

    /* Auto-Changing Image Slider Styles */
    .center-media-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .center-media-wrapper img.active {
      opacity: 1;
    }

    /* Button Container */
    .cta-container {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* 1. Portfolio Button */
    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0a66c2;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-linkedin:hover {
      background-color: #004182;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }

    /* 2. Stories and Thoughts Button */
    .btn-fun {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e60023;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-fun:hover {
      background-color: #ff1a3c;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }
  </style>
</head>
<body>

  <!-- Top Header Name -->
  <header class="top-header">
    NANDI SIHOL
  </header>

  <main class="hero-container">

    <!-- Center Media Frame with Auto-Rotating Images -->
    <div class="center-media-wrapper" id="image-slider">
      <img src="WhatsApp Image 2026-07-24 at 17.36.38.jpeg" alt="Nandi Sihol 1" class="active">
      <img src="Nandi Sihol (Photo).png" alt="Nandi Sihol 2">
    </div>

    <!-- Dual CTA Buttons -->
    <div class="cta-container">
      <a href="#portfolio" class="btn-linkedin">
        Portfolio
      </a>

      <a href="#stories" class="btn-fun">
        Stories and Thoughts
      </a>
    </div>

  </main>

  <!-- Auto-Rotation Script -->
  <script>
    const images = document.querySelectorAll('#image-slider img');
    let currentIndex = 0;

    function rotateImages() {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active');
    }

    setInterval(rotateImages, 3500);
  </script>

</body>
</html>
