<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Hero - Earth Tone</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Earthy organic gradient palette */
      background: linear-gradient(135deg, #c86d51 0%, #d4a373 35%, #a3b18a 70%, #e9edc9 100%);
      color: #283618;
      overflow-x: hidden;
      padding: 40px 20px;
      position: relative;
    }

    /* Main Container */
    .hero-container {
      max-width: 1200px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 2;
    }

    /* Single-Line Ultra-Bold Headline */
    .hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #283618;
      white-space: nowrap; /* Keeps headline strictly in one line */
      width: 100%;
    }

    /* Center Large Square Media Frame (Fits Image or Video) */
    .center-media-wrapper {
      width: clamp(220px, 28vw, 320px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      border: 3px solid #283618;
      box-shadow: 7px 7px 0px #283618;
      overflow: hidden;
      background: #fefae0;
      transition: transform 0.3s ease;
    }

    .center-media-wrapper:hover {
      transform: scale(1.02) rotate(-1.5deg);
    }

    .center-media-wrapper img,
    .center-media-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Button Container */
    .cta-container {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    /* 1. LinkedIn Professional / Serious Style Button */
    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #0a66c2; /* Authentic LinkedIn Navy */
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 24px;
      border: 1px solid #0a66c2;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(10, 102, 194, 0.25);
      transition: all 0.2s ease;
    }

    .btn-linkedin:hover {
      background-color: #004182;
      border-color: #004182;
      box-shadow: 0 6px 16px rgba(10, 102, 194, 0.35);
      transform: translateY(-2px);
    }

    /* 2. Pinterest / Medium Fun & Playful Style Button */
    .btn-fun {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #e60023; /* Warm Pinterest Red Accent */
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 26px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transform: rotate(-2deg); /* Playful angle */
      transition: all 0.2s ease;
    }

    .btn-fun:hover {
      transform: rotate(0deg) scale(1.05);
      box-shadow: 6px 6px 0px #283618;
      background-color: #ff1a3c;
    }
  </style>
</head>
<body>

  <main class="hero-container">

    <!-- Single-Line Headline -->
    <h1 class="hero-title">
      My Portfolio & Stories and Thoughts
    </h1>

    <!-- Center Media Frame (Square) -->
    <div class="center-media-wrapper">
      <!-- OPTION A: For Video (Uncomment below to use video) -->
      <!--
      <video autoplay loop muted playsinline poster="your-fallback-image.jpg">
        <source src="your-video.mp4" type="video/mp4">
      </video>
      -->

      <!-- OPTION B: For Image -->
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Hero Media">
    </div>

    <!-- Dual CTA Buttons -->
    <div class="cta-container">
      <!-- Serious LinkedIn Style Button -->
      <a href="#portfolio" class="btn-linkedin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
        Portfolio
      </a>

      <!-- Fun Pinterest/Medium Style Button -->
      <a href="#stories" class="btn-fun">
        Stories and Thoughts ✨
      </a>
    </div>

  </main>

</body>
</html>
