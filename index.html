<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Hero - Earth Tone</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Earthy organic gradient palette */
      background: linear-gradient(135deg, #c86d51 0%, #d4a373 35%, #a3b18a 70%, #e9edc9 100%);
      color: #283618;
      overflow-x: hidden;
      padding: 40px 20px;
      position: relative;
    }

    /* Main Container */
    .hero-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      position: relative;
      z-index: 2;
    }

    /* Two-Line Ultra-Bold Headline */
    .hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2.2rem, 5.5vw, 4.2rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #283618;
    }

    .hero-title span {
      display: block;
    }

    /* Center Large Square Media Frame */
    .center-media-wrapper {
      width: clamp(220px, 28vw, 320px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      border: 3px solid #283618;
      box-shadow: 7px 7px 0px #283618;
      overflow: hidden;
      background: #fefae0;
      transition: transform 0.3s ease;
    }

    .center-media-wrapper:hover {
      transform: scale(1.02);
    }

    .center-media-wrapper img,
    .center-media-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Button Container */
    .cta-container {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    /* 1. Portfolio Button (Navy Blue with Brutalist Shadow) */
    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0a66c2;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-linkedin:hover {
      background-color: #004182;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }

    /* 2. Stories and Thoughts Button (Coral Red with Brutalist Shadow) */
    .btn-fun {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e60023;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-fun:hover {
      background-color: #ff1a3c;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }
  </style>
</head>
<body>

  <main class="hero-container">

    <!-- Two-Line Headline -->
    <h1 class="hero-title">
      My Portfolio,
      <span> Stories, and Thoughts</span>
    </h1>

    <!-- Center Media Frame (Square) -->
    <div class="center-media-wrapper">
      <img src="profile.jpg" alt="Profile Picture">
    </div>

    <!-- Dual CTA Buttons -->
    <div class="cta-container">
      <a href="#portfolio" class="btn-linkedin">
        Portfolio
      </a>

      <a href="#stories" class="btn-fun">
        Stories and Thoughts
      </a>
    </div>

  </main>

</body>
</html>
