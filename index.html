<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nandi Sihol</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Earthy organic gradient palette */
      background: linear-gradient(135deg, #c86d51 0%, #d4a373 35%, #a3b18a 70%, #e9edc9 100%);
      color: #283618;
      overflow-x: hidden;
      padding: 90px 20px 40px 20px;
      position: relative;
    }

    /* Top Brand Header */
    .top-header {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #283618;
      z-index: 10;
    }

    /* Main Center Container */
    .hero-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 2;
    }

    /* Center Square Media Frame */
    .center-media-wrapper {
      width: clamp(280px, 40vw, 440px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      border: 3px solid #283618;
      box-shadow: 7px 7px 0px #283618;
      overflow: hidden;
      background: #fefae0;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 2; /* Keeps frame above the ball initially */
    }

    .center-media-wrapper:hover {
      transform: scale(1.02);
    }

    /* Auto-Changing Image Slider Styles */
    .center-media-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .center-media-wrapper img.active {
      opacity: 1;
    }

    /* --- PADEL BALL ANIMATION STYLES --- */
    .padel-ball {
      position: absolute;
      width: 48px;
      height: 48px;
      background-color: #ccff00; /* Padel yellow-green */
      border: 2.5px solid #283618;
      border-radius: 50%;
      box-shadow: 3px 3px 0px #283618;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 1; /* Starts behind image frame */
    }

    /* Curved Seams on Padel Ball */
    .padel-ball::before,
    .padel-ball::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #283618;
      border-radius: 50%;
      top: 0;
      left: 0;
    }

    .padel-ball::before {
      clip-path: inset(0 60% 0 0);
      transform: scale(0.85) translateX(3px);
    }

    .padel-ball::after {
      clip-path: inset(0 0 0 60%);
      transform: scale(0.85) translateX(-3px);
    }

    /* Active Animation Class Triggered by JS */
    .padel-ball.launch {
      animation: shootPadelBall 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Ball Trajectory Keyframes */
    @keyframes shootPadelBall {
      0% {
        opacity: 1;
        z-index: 1;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      20% {
        z-index: 3; /* Pops out in front of the image frame */
        transform: translate(60px, -80px) scale(1.1) rotate(90deg);
      }
      50% {
        transform: translate(160px, 40px) scale(0.95) rotate(180deg);
      }
      80% {
        transform: translate(250px, -20px) scale(0.8) rotate(270deg);
        opacity: 0.9;
      }
      100% {
        transform: translate(320px, 80px) scale(0.5) rotate(360deg);
        opacity: 0;
      }
    }

    /* Button Container */
    .cta-container {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* 1. Portfolio Button */
    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0a66c2;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-linkedin:hover {
      background-color: #004182;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }

    /* 2. Stories and Thoughts Button */
    .btn-fun {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e60023;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2.5px solid #283618;
      text-decoration: none;
      box-shadow: 4px 4px 0px #283618;
      transition: all 0.2s ease;
    }

    .btn-fun:hover {
      background-color: #ff1a3c;
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #283618;
    }
  </style>
</head>
<body>

  <!-- Top Header Name -->
  <header class="top-header">
    NANDI SIHOL
  </header>

  <main class="hero-container">

    <!-- Center Media Frame with Auto-Rotating Images -->
    <div class="center-media-wrapper" id="image-slider">
      <img src="Nandi Sihol (Photo).png" alt="Nandi Sihol 1" class="active">
      <img src="WhatsApp Image 2026-07-24 at 17.36.38.jpeg" alt="Nandi Sihol 2">
    </div>

    <!-- Animated Padel Ball -->
    <div class="padel-ball" id="padel-ball"></div>

    <!-- Dual CTA Buttons -->
    <div class="cta-container">
      <a href="#portfolio" class="btn-linkedin">
        Portfolio
      </a>

      <a href="#stories" class="btn-fun">
        Stories and Thoughts
      </a>
    </div>

  </main>

  <!-- Script for Auto-Rotation & Animation Trigger -->
  <script>
    const images = document.querySelectorAll('#image-slider img');
    const padelBall = document.getElementById('padel-ball');
    let currentIndex = 0;

    function rotateImages() {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active');

      // Trigger padel ball animation specifically when the 2nd image (index 1) appears
      if (currentIndex === 1) {
        padelBall.classList.remove('launch'); // Reset animation
        void padelBall.offsetWidth;          // Trigger DOM reflow
        padelBall.classList.add('launch');    // Play animation
      }
    }

    setInterval(rotateImages, 3500);
  </script>

</body>
</html>
